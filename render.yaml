services:
  - type: web
    name: telchurn-api
    runtime: python
    plan: free
    rootDir: python-server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
